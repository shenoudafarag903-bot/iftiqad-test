<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تطبيق افتقاد</title>
<style>
:root{--bg:#070B14;--card:#111827;--line:#1F2937;--gold:#F5C542;--ind:#6366F1;--txt:#E5E7EB;--mut:#9CA3AF;--ok:#10B981;--bad:#EF4444;--acc:#3B82F6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 12px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1;color:var(--acc)}
#sync{font-size:11px;color:var(--mut);white-space:nowrap}
button{font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;padding:9px 12px;font-size:14px;transition:transform .12s,background .15s}
button:active{transform:scale(.94);background:#1b2538}
button:disabled{opacity:.5}
.top-btn{font-size:13px;padding:8px 10px}
input,select,textarea{font-family:inherit;width:100%;background:#0b1220;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px}
#search{margin-top:8px}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1}
.tabs button.on,.wkbar button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.wkbar{display:none;gap:6px;margin-top:8px}
.wkbar button{flex:1;padding:10px 2px;font-size:14px}
#list{flex:1;overflow-y:auto;padding:10px 12px 90px}
.legend{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:1fr repeat(4,50px);gap:6px;padding:8px 12px 6px;margin:-10px -12px 8px;font-size:12px;color:var(--mut);text-align:center;border-bottom:1px solid var(--line)}
.legend.d{grid-template-columns:1fr 74px 74px}
.legend b{font-weight:600}
.legend b:first-child{text-align:right}
.r{display:grid;grid-template-columns:1fr repeat(4,50px);gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-right:4px solid var(--acc);border-radius:14px;padding:7px;margin-bottom:8px}
.r.d{grid-template-columns:1fr 74px 74px}
.nb{background:none;border:0;text-align:right;padding:4px;color:var(--txt);font-size:15px;font-weight:700;line-height:1.35;min-width:0;word-break:break-word}
.nb small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.tg{height:44px;padding:0;border-radius:12px;font-size:19px;color:#4b5563}
.tg.s1{background:rgba(16,185,129,.2);border-color:var(--ok);color:var(--ok);font-weight:700}
.tg.s2{background:rgba(239,68,68,.2);border-color:var(--bad);color:var(--bad);font-weight:700}
.tg.t{font-size:14px}
.tag{background:rgba(239,68,68,.2);color:var(--bad);border-radius:8px;font-size:11px;padding:2px 6px;margin-inline-start:6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--acc);border-radius:16px;padding:12px;margin-bottom:10px}
.card.gold{border-color:var(--gold);background:rgba(245,197,66,.08)}
.hd{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none}
.nm{font-size:17px;font-weight:700}
.sub{color:var(--mut);font-size:13px;margin-top:2px;word-break:break-word}
.tm{background:rgba(245,158,11,.15);color:#F59E0B;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.alm{margin-top:8px;font-size:13px;color:var(--gold)}
.stat{width:100%;margin-top:10px;padding:13px;font-size:16px;font-weight:700}
.stat.wait{background:rgba(245,197,66,.12);border-color:var(--gold);color:var(--gold)}
.stat.done{background:rgba(16,185,129,.18);border-color:var(--ok);color:var(--ok)}
.acts3{display:grid;grid-template-columns:1fr 1fr 1fr 44px;gap:6px;margin-top:8px}
.acts3 button{padding:10px 4px;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:12px}
.banner{background:rgba(245,197,66,.1);border:1px solid var(--gold);border-radius:14px;padding:10px;margin-bottom:10px;font-size:13px;display:flex;gap:8px;align-items:center}
.banner.red{background:rgba(239,68,68,.1);border-color:var(--bad)}
.banner span{flex:1;line-height:1.6}
.mnav{display:grid;grid-template-columns:90px 1fr 90px;gap:8px;align-items:center;margin-bottom:10px}
.mnav .mt{text-align:center;font-weight:700;font-size:17px;color:var(--acc)}
.bdr{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-right:4px solid var(--acc);border-radius:14px;padding:8px;margin-bottom:8px}
.bdr.today{border-color:var(--gold);background:rgba(245,197,66,.10)}
.bdr.past{opacity:.55}
.bdr2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}
.dy{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:17px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{display:flex;border-top:1px solid var(--line);background:#0b1220}
nav button{flex:1;border:0;border-radius:0;background:transparent;padding:6px 1px;font-size:10px;color:var(--mut);line-height:1.25;position:relative}
nav button i{display:block;font-style:normal;font-size:17px}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
nav button b{position:absolute;top:1px;left:50%;margin-left:5px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;min-width:16px}
#fab{position:fixed;left:16px;bottom:76px;background:var(--acc);border:0;color:#fff;font-size:15px;font-weight:700;padding:13px 18px;border-radius:30px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
#dlg .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:440px;max-height:92%;overflow-y:auto}
#dlg h3{margin:0 0 10px;color:var(--gold);font-size:17px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bt{display:flex;gap:8px;margin-top:12px}.bt button{flex:1;padding:12px}
.mi{width:100%;text-align:right;margin-bottom:8px;padding:14px;font-size:15px}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 8px}
.big4 button{padding:12px 6px;font-size:22px;display:flex;flex-direction:column;gap:2px;align-items:center}
.big4 button span{font-size:13px}
.mg{margin:12px 0 4px}
.mg h4{margin:0 0 6px;font-size:13px;color:var(--mut)}
.mgr{display:grid;grid-template-columns:54px repeat(4,1fr);gap:6px;align-items:center;margin-bottom:6px}
.mgr.d{grid-template-columns:54px 1fr 1fr}
.mgr b{font-size:12px;color:var(--mut);font-weight:600}
.mgr.h b{text-align:center}
.mgr .tg{height:40px}
.pri{background:var(--ind)!important;border-color:var(--ind)!important;color:#fff}
.dng{background:rgba(239,68,68,.2)!important;border-color:var(--bad)!important;color:var(--bad)}
.stline{display:flex;gap:8px;align-items:center;padding:10px;background:#0b1220;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:14px}
.stline span{flex:1}
.stline button{padding:7px 10px;font-size:12px}
.chk{display:flex;gap:10px;align-items:center;padding:10px;background:#0b1220;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:15px}
.chk input{width:22px;height:22px;flex:none}
.lg{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.lg small{display:block;color:var(--mut);font-size:12px}
.empty{text-align:center;color:var(--mut);margin-top:50px;line-height:1.9}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:99;max-width:90%;text-align:center}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;transition:opacity .6s}
#splash h2{color:var(--gold);margin:14px 0 0;font-size:26px}
#splash p{color:var(--mut);margin:6px 0 0}
#ov{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:150}
#ov .box{width:100%;max-width:380px;text-align:center}
#ov h2{color:var(--gold);margin:10px 0 4px}
#ov p{color:var(--mut);line-height:1.8;font-size:14px}
#ov .f{text-align:right}
#ov .err{color:var(--bad);font-size:14px;min-height:22px;margin:6px 0}

:root{--bg:#09090B;--card:#18181D;--card2:#202027;--line:#27272A;--txt:#FAFAFA;--mut:#A1A1AA;--acc:#8955ED;--acc2:#B69AFF;--ok:#22C55E;--bad:#EF4444;--warn:#F59E0B;--ease:cubic-bezier(.2,.8,.2,1)}
html,body{background:var(--bg);color:var(--txt);font-size:15px}
header{background:rgba(9,9,11,.92);border-bottom:1px solid var(--line);padding:14px 16px 12px;backdrop-filter:blur(8px)}
h1{color:var(--txt);font-size:20px;font-weight:700;letter-spacing:-.01em}
button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--txt);transition:transform .12s var(--ease),background .2s,border-color .2s,color .2s}
button:active{transform:scale(.96)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:12px 14px;font-size:15px;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
#list{padding:12px 16px 110px;animation:up .34s var(--ease)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.r,.item{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset;transition:transform .15s var(--ease),background .2s}
.card:active,.r:active{transform:scale(.985);background:var(--card2)}
nav{background:rgba(17,17,20,.94);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
nav button{background:none;border:0;color:var(--mut);font-size:12.5px;font-weight:600}
nav button.on{color:var(--txt);box-shadow:inset 0 3px 0 var(--acc)}
#fab{position:fixed;left:14px;bottom:calc(76px + 14px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;padding:0;background:#6D4AE8;color:#fff;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;box-shadow:0 14px 30px -8px rgba(109,74,232,.95),0 0 0 4px rgba(109,74,232,.18);z-index:40}
#fab .pl{font-size:26px;font-weight:700;line-height:1}
#fab .lb{font-size:11px;font-weight:700}
#fab:active{transform:scale(.94)}
.sheet,#dlg .box{background:#111114;border:1px solid var(--line);border-radius:22px}
#dlg{background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
#toast{background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--txt)}

.hero{background:linear-gradient(140deg,#8955ED,#4C1D95);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 18px 30px -18px rgba(137,85,237,.8)}
.hero .dt{font-size:13px;opacity:.9}
.hero .fri{font-size:22px;font-weight:800;margin-top:6px}
.hero .hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero .hs div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 6px;text-align:center}
.hero .hs b{display:block;font-size:20px}
.hero .hs span{font-size:12px;opacity:.9}
.gh{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px;font-size:14px;color:#A1A1AA;font-weight:700}
.gh b{background:#27272A;color:#FAFAFA;border-radius:999px;padding:2px 9px;font-size:12px}
.hrow{display:flex;align-items:center;gap:12px;background:#18181D;border:1px solid #27272A;border-radius:18px;padding:12px;margin-bottom:8px}
.hrow .grow{flex:1;min-width:0}
.hrow .sub{font-size:13px;color:#A1A1AA}
.av.sm{width:38px;height:38px;border-radius:12px;font-size:15px}
.pc{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.ph{width:38px;height:28px;padding:0;border-radius:10px;font-size:13px;font-weight:700;background:#202027;color:#A1A1AA;border:1px solid #27272A}
.ph.y.on{background:#22C55E;color:#fff;border-color:#22C55E}
.ph.n.on{background:#EF4444;color:#fff;border-color:#EF4444}
.undo{background:#8955ED;color:#fff;border:0;border-radius:10px;padding:4px 10px;margin-inline-start:8px}
#toast{display:none;max-width:92%;white-space:normal}

/* ---- navigation motion: forward / back, and each new screen settles in ---- */
#list.nav-fwd{animation:slideFwd .38s var(--ease) both}
#list.nav-back{animation:slideBack .38s var(--ease) both}
@keyframes slideFwd{from{opacity:0;transform:translate3d(28px,0,0)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translate3d(-28px,0,0)}to{opacity:1;transform:none}}
/* ---- lists: rows come in one after the other ---- */
#list>*{animation:rowIn .42s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
#list>*:nth-child(2){animation-delay:40ms}#list>*:nth-child(3){animation-delay:80ms}#list>*:nth-child(4){animation-delay:120ms}
#list>*:nth-child(5){animation-delay:160ms}#list>*:nth-child(6){animation-delay:200ms}#list>*:nth-child(7){animation-delay:240ms}
#list>*:nth-child(n+8){animation-delay:280ms}
/* ---- modern list rows ---- */
.r{display:flex;align-items:center;gap:10px;padding:12px 12px;margin-bottom:10px;border-radius:20px;background:linear-gradient(180deg,#1C1C24,#17171E);border:1px solid #27272A;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 18px -14px rgba(0,0,0,.9)}
.r .nb{flex:1;min-width:0;text-align:start;padding:6px 4px;font-size:16px;font-weight:700;color:#FAFAFA}
.r .nb small{font-size:12.5px;color:#A1A1AA;font-weight:500;margin-top:2px}
.r .tg{border-radius:14px;min-height:40px;font-weight:700}
.r.d .tg{min-width:64px}
.card{border-radius:22px;background:linear-gradient(180deg,#1C1C24,#17171E);border:1px solid #27272A;margin-bottom:10px;box-shadow:0 12px 22px -16px rgba(0,0,0,.9)}
.card .nm{font-size:16px;font-weight:700}
.card .sub{color:#A1A1AA;font-size:13px}
.tm{border-radius:12px;background:rgba(137,85,237,.14);color:#C4B5FD;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stats span{border-radius:16px;background:#18181D;border:1px solid #27272A;padding:12px 10px;font-size:13px;color:#A1A1AA;text-align:start}
.stats span b{color:#FAFAFA;font-size:20px;display:block}
.legend{display:flex;gap:10px;color:#A1A1AA;font-size:12px;margin:4px 6px 10px}
.legend b{position:sticky;top:0;color:#A1A1AA}
.empty{border-radius:20px;background:#18181D;border:1px dashed #3F3F46;padding:24px;color:#A1A1AA}
/* ---- nav: the active tab gets a soft pill that glides in ---- */
nav button{transition:color .25s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease)}
nav button.on{background:rgba(137,85,237,.14);border-radius:16px;box-shadow:none;color:#FAFAFA}
</style>
</head>

function valTxt(v){return v==1?'تم':v==2?'لم يتم':'مسح'}

wr(function(b){var o={};o['att.'+w]=v;b.update(sref(s.id),stamp(o));addLog(b,s.section,'mark',s.name+' — جمعة '+(w+1)+': '+attTxt(v)+(old?' (كانت: '+attTxt(old)+')':''),s)})}

if(NATIVE){

function mkProfile(u,data){
var email=(u.email||'').toLowerCase();var admin=ADMINS.indexOf(email)>-1;
return{uid:u.uid,email:email,login:showLogin(email),isAdmin:admin,name:(data&&data.name)||showLogin(email),
sections:admin?SECTIONS.map(function(x){return x.k}):((data&&data.sections)||[]).filter(function(k){return SECTIONS.some(function(x){return x.k===k})}),
active:admin||!!(data&&data.active!==false)}}

function signedIn(u){
FBX.getDoc(FBX.doc(db,'users',u.uid)).then(function(d){
var data=d.exists()?d.data():null;
var me=mkProfile(u,data);
if(me.isAdmin&&!data){askAdminName(u,me);return}
lsSet('iftiqad_me',me);startSession(me)
}).catch(function(){
var c=lsGet('iftiqad_me');
if(c&&c.uid===u.uid)startSession(c);else startSession(mkProfile(u,null))})}

function askAdminName(u,me){

$('ay2').onclick=function(){var n=$('an').value.trim();if(!n){toast('اكتب اسمك');return}
me.name=n;
FBX.setDoc(FBX.doc(db,'users',u.uid),{name:n,login:me.email,sections:[],active:true,admin:true,createdAt:FBX.serverTimestamp()}).catch(function(){});
lsSet('iftiqad_me',me);closeDlg();startSession(me)}}

function startSession(me){
ME=me;
if(!me.active||(!me.isAdmin&&!me.sections.length)){detach();showOv('blocked');return}
hideOv();
if(me.isAdmin&&localStorage.getItem('iftiqad_ack')==null)localStorage.setItem('iftiqad_ack',String(Date.now()));
var v=vis();
if(startTab==='today'||startTab==='bday')cur=startTab;else cur='today';
attach();render();
if(startTab==='alerts'&&me.isAdmin)alertsDlg();
startTab='';

function watchMe(){if(NATIVE)return;
unsubs.push(FBX.onSnapshot(FBX.doc(db,'users',ME.uid),function(d){
if(!d.exists())return;
var me=mkProfile({uid:ME.uid,email:ME.email},d.data());
var changed=JSON.stringify(me.sections)!==JSON.stringify(ME.sections)||me.active!==ME.active||me.name!==ME.name;
if(!changed)return;
lsSet('iftiqad_me',me);
if(!me.active||!me.sections.length){ME=me;detach();showOv('blocked');return}
ME=me;attach();watchMe();
if(!vis().some(function(x){return x.k===cur})&&cur!=='today'&&cur!=='bday')cur=vis()[0].k;
render()},function(){}))}

/* ================= listeners ================= */
function detach(){unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[]}
function attach(){if(NATIVE)return;
detach();S.servees=[];S.archive=[];S.alerts=[];pend={};cached={};
ME.sections.forEach(function(sc){
unsubs.push(FBX.onSnapshot(FBX.query(FBX.collection(db,'servees'),FBX.where('section','==',sc)),{includeMetadataChanges:true},function(snap){onServees(sc,snap)},function(e){if(e&&e.code==='permission-denied')toast('ما عندكش صلاحية على قسم')}));
loadArchive(sc);
if(ME.isAdmin)attachAlerts(sc)})}
function onServees(sc,snap){
var list=snap.docs.map(fromDoc);
S.servees=S.servees.filter(function(x){return x.section!==sc}).concat(list);

function afterData(){
var s=live().map(function(x){return[x.id,x.name,x.phone,x.alarmAt,x.status,x.bday,x.bmon].join('|')}).join(';');
if(s!==sig){sig=s;resync()}}
function updateSync(){

e.textContent=!navigator.onLine?'📴 أوفلاين':(anyPend?'⏳ جاري الرفع':'☁️ متزامن')}

S.archive=S.archive.filter(function(a){return a.section!==sc}).concat(snap.docs.map(archFrom));scheduleRender()}).catch(function(){})}

/* ================= stats / absentees ================= */
function pillarStats(L,k){return PL(k).map(function(pl){var ok=0,tot=0;L.forEach(function(s){for(var w=0;w<4;w++){var v=s.p[w][pl[0]]||0;if(v==1){ok++;tot++}else if(v==2)tot++}});return{n:pl[1],ok:ok,tot:tot}})}
function attStats(L){var ok=0,tot=0;L.forEach(function(s){s.att.forEach(function(v){if(v==1){ok++;tot++}else if(v==2)tot++})});return{ok:ok,tot:tot}}
function pct(ok,tot){return tot?Math.round(ok*100/tot)+'%':'—'}
function ws(rec,kind,w){
if(!rec)return'none';
if(kind==='p'){var any=0,miss=0;KEYS.forEach(function(k){var v=(rec.p[w]||{})[k]||0;if(v==1)any=1;if(v==2)miss=1});return any?'ok':miss?'miss':'none'}
var v2=(rec.att||[])[w]||0;return v2==1?'ok':v2==2?'miss':'none'}
function streak(s){
var kind=sec(s.section).kind;var seq=[];
S.archive.filter(function(a){return a.section===s.section}).sort(function(a,b){return a.ts-b.ts}).slice(-2).forEach(function(a){var rec=null;for(var i=0;i<a.servees.length;i++)if(a.servees[i].id===s.id)rec=a.servees[i];for(var w=0;w<4;w++)seq.push(ws(rec,kind,w))});
for(var w2=0;w2<4;w2++)seq.push(ws(s,kind,w2));
while(seq.length&&seq[seq.length-1]==='none')seq.pop();
var n=0;while(seq.length&&seq[seq.length-1]==='miss'){n++;seq.pop()}
return n}
function absentees(){var out=[];live().forEach(function(s){var n=streak(s);if(n>=2)out.push({s:s,n:n})});out.sort(function(a,b){return b.n-a.n});return out}

function reportSpec(k,L,label,extra){

var pl=PL(k);var cols=[3.4],h1=[{t:'الاسم'}],h2=[{t:''}];
for(var w=0;w<4;w++){h1.push({t:'جمعة '+(w+1),s:4});pl.forEach(function(p){h2.push({t:p[1]});cols.push(1)})}

}else{

spec.stats.push({v:pct(a.ok,a.tot),l:'نسبة الحضور'});spec.stats.push({v:done+' / '+L.length,l:'تم الافتقاد'});
var r1=[];L.forEach(function(s){var cnt=s.att.filter(function(v){return v==1}).length;
r1.push([{t:s.name,a:'r'}].concat(s.att.map(function(v){return{t:v==1?'حاضر':v==2?'غائب':'',bg:v==1?'g':v==2?'r':''}}),[{t:cnt+' / 4',b:true}]))});

spec.tables.push({heading:'كشف حضور الاجتماع',cols:[3,1,1,1,1,1.2],head:[[{t:'الاسم'},{t:'جمعة 1'},{t:'جمعة 2'},{t:'جمعة 3'},{t:'جمعة 4'},{t:'مرات الحضور'}]],rows:r1,fs:9});
var r2=[];L.forEach(function(s){r2.push([{t:s.name,a:'r'},{t:s.phone||'—'},{t:s.alarmAt?fmtS(s.alarmAt):'—'},{t:s.status==='done'?'تم الافتقاد':'في الانتظار',bg:s.status==='done'?'g':'y'}])});
if(!r2.length)r2.push([{t:'لا يوجد مخدومين',s:4}]);

return spec}

try{boot()}catch(e){var er=document.getElementById('lerr');var msg='خطأ عند التشغيل: '+String(e&&e.message||e);if(er){showOv('login',msg)}else{showOv('login',msg)}}
setInterval(function(){var c=document.getElementById('clockTxt');if(c&&cur==='today'){var d=new Date();c.textContent=d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}},30000);

(function(){
  var L=document.getElementById('list'); if(!L) return;
  new MutationObserver(function(){
    var back=window.__dir==='back';window.__dir=null;
    L.classList.remove('nav-fwd','nav-back'); void L.offsetWidth;
    L.classList.add(back?'nav-back':'nav-fwd');
  }).observe(L,{childList:true});
})();
</script>
</body>
